<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
          <path d="M12 6v6l4 2"></path>
          <circle cx="12" cy="12" r="3" class="pulse-node"></circle>
        </svg>
      </div>
      <h1>ImageCyte</h1>
      <p class="subtitle">Live Microscopy Analysis Portal</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required 
            placeholder="Enter your username"
            [disabled]="isLoading"
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            placeholder="••••••••"
            [disabled]="isLoading"
            autocomplete="current-password"
          />
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" class="error-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" [disabled]="isLoading || !loginForm.valid" class="btn-submit">
        <span *ngIf="!isLoading">Access Dashboard</span>
        <span *ngIf="isLoading" class="spinner-inline"></span>
      </button>
    </form>
    
    <div class="card-footer">
      <p>Protected by ImageCyte Gateway Proxy</p>
    </div>
  </div>
</div>
