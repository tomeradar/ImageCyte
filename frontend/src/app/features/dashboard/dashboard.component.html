<div class="dashboard-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" class="header-logo-icon">
        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span class="app-title">ImageCyte AI</span>
    </div>

    <!-- Timeframe Filters Selection -->
    <div class="header-timeframe">
      <label class="timeframe-label">Range:</label>
      <select [ngModel]="selectedTimeframe()" (ngModelChange)="onTimeframeChange($event)" class="select-timeframe">
        <option value="all">All History</option>
        <option value="10m">Last 10 Min</option>
        <option value="30m">Last 30 Min</option>
        <option value="1h">Last Hour</option>
        <option value="1d">Last Day</option>
        <option value="custom">Custom Range</option>
      </select>

      <div *ngIf="selectedTimeframe() === 'custom'" class="custom-time-inputs">
        <input type="datetime-local" [ngModel]="customStart()" (ngModelChange)="customStart.set($event)" class="input-datetime" />
        <span class="range-separator">to</span>
        <input type="datetime-local" [ngModel]="customEnd()" (ngModelChange)="customEnd.set($event)" class="input-datetime" />
        <button (click)="applyCustomFilter()" class="btn-apply">Filter</button>
      </div>
    </div>
    
    <div class="header-status">
      <span class="status-badge" [class.live]="isLiveMode()" [class.paused]="!isLiveMode()">
        <span class="pulse-indicator" *ngIf="isLiveMode()"></span>
        {{ isLiveMode() ? 'Live Feed' : 'Historical Snapshot' }}
      </span>
      <span class="scan-id" *ngIf="currentImage()">ID: {{ currentImage()?.image_id }}</span>
    </div>

    <div class="header-actions">
      <button *ngIf="!isLiveMode()" (click)="resumeLive()" class="btn-resume">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" class="icon-spacing">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Resume Live
      </button>
      <button (click)="logout()" class="btn-logout">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" class="icon-spacing">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <main class="workspace-grid">
    <!-- Viewport Panel component -->
    <app-viewport 
      [currentImage]="currentImage()" 
      [isLoading]="isLoading()" 
      [hasError]="hasError()" 
      [errorMessage]="errorMessage()"
      class="viewport-wrapper"
    ></app-viewport>

    <!-- Sidebar Metrics & Histogram components -->
    <aside class="sidebar-panel">
      <app-metrics [currentImage]="currentImage()"></app-metrics>
      <app-histogram [histogram]="currentImage()?.histogram || []"></app-histogram>
    </aside>
  </main>

  <!-- Horizontal movie-like scrubbing timeline bar -->
  <app-timeline-scrub-bar 
    [historyList]="historyList()" 
    [currentImageId]="currentImage()?.image_id || null"
    (selectImage)="selectHistoryItem($event)"
  ></app-timeline-scrub-bar>
</div>
